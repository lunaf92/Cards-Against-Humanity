services:
  postgres:
    image: postgres:16-alpine
    container_name: cah_postgres
    environment:
      POSTGRES_USER: cah_user
      POSTGRES_PASSWORD: cah_password
      POSTGRES_DB: cah_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cah_user -d cah_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cah_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations once, then exits. backend and worker both wait
  # on this instead of each running `alembic upgrade head` themselves — running
  # it from two containers at once races to CREATE TABLE alembic_version on a
  # fresh database and one of them loses with a UniqueViolation.
  migrate:
    build: .
    container_name: cah_migrate
    command: alembic upgrade head
    env_file:
      - .envs/.env.dev
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build: .
    container_name: cah_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .envs/.env.dev
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1
      # Fast coverage tracer (sys.monitoring); without it, coverage slows tests ~10x
      # and real 90s round timers start firing in the middle of gameplay tests.
      - COVERAGE_CORE=sysmon

  worker:
    build: .
    container_name: cah_worker
    command: python -m app.workers.matchmaking
    env_file:
      - .envs/.env.dev
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data:
  redis_data:
